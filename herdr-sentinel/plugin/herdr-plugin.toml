id = "ingen.herdr-sentinel.probe"
name = "InGen Herdr Sentinel Probe"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Capture Herdr event envelopes and invocation context for Sentinel host-contract review"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.created"
command = ["sh", "record-event.sh"]

[[events]]
on = "workspace.updated"
command = ["sh", "record-event.sh"]

[[events]]
on = "workspace.closed"
command = ["sh", "record-event.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "record-event.sh"]

[[events]]
on = "worktree.opened"
command = ["sh", "record-event.sh"]

[[events]]
on = "worktree.removed"
command = ["sh", "record-event.sh"]

[[events]]
on = "pane.created"
command = ["sh", "record-event.sh"]

[[events]]
on = "pane.exited"
command = ["sh", "record-event.sh"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "record-event.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "record-event.sh"]
