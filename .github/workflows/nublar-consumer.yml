name: Nublar consumer gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    name: Produce CI envelopes
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run producer workflows
        id: producers
        continue-on-error: true
        env:
          GOCACHE: ${{ runner.temp }}/ingen-go-build
          GOMODCACHE: ${{ runner.temp }}/ingen-go-mod
        run: |
          set +e
          make -k \
            sorna-ci-result \
            mutation-go-provider-ci-result \
            mutation-go-preparation-ci-result \
            mutation-go-campaign-ci-result
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload declared producer envelopes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nublar-producer-envelopes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/document-pipeline-go-provider-ci-result.json
            .artifacts/document-pipeline-go-preparation-ci-result.json
            .artifacts/document-pipeline-ci-result.json
            .artifacts/document-pipeline-go-campaign-ci-result.json
          if-no-files-found: warn
          retention-days: 14

  nublar-consumer:
    name: Collect with Nublar
    needs: producer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download producer envelopes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nublar-producer-envelopes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts

      - name: Run Nublar CI gate
        id: nublar
        continue-on-error: true
        env:
          GOCACHE: ${{ runner.temp }}/ingen-go-build
          GOMODCACHE: ${{ runner.temp }}/ingen-go-mod
        run: |
          set +e
          bash nublar/examples/consumer/nublar-ci-gate.sh \
            --workflow nublar/workflows/document-pipeline.yaml \
            --root .artifacts \
            --store .artifacts/nublar-runs \
            --output .artifacts/nublar-run.json \
            --external-system github-actions \
            --external-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Verify GitHub Actions correlation
        if: steps.nublar.outcome == 'success'
        run: |
          jq -e \
            --arg id "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '.correlation == {system: "github-actions", id: $id, attempt: $attempt}' \
            .artifacts/nublar-run.json >/dev/null

      - name: Publish Nublar GitHub Check
        id: github-checks
        if: always() && hashFiles('.artifacts/nublar-run.json') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOCACHE: ${{ runner.temp }}/ingen-go-build
          GOMODCACHE: ${{ runner.temp }}/ingen-go-mod
        run: |
          run_id="$(jq -er '.run_id' .artifacts/nublar-run.json)"
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          go run ./nublar/cmd/nublar run deliver \
            --transport github-checks \
            --store .artifacts/nublar-runs \
            --run-id "$run_id" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --details-url "$details_url" \
            --token-env GITHUB_TOKEN \
            --receipt .artifacts/nublar-github-checks-receipt.json \
            --receipt-store .artifacts/nublar-receipts

      - name: Upload Nublar run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nublar-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/nublar-run.json
            .artifacts/nublar-run.decision.json
            .artifacts/nublar-runs
            .artifacts/nublar-github-checks-receipt.json
            .artifacts/nublar-receipts
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate Nublar decision
        if: always()
        env:
          NUBLAR_GATE_OUTCOME: ${{ steps.nublar.outcome }}
          NUBLAR_GATE_EXIT_CODE: ${{ steps.nublar.outputs.exit_code }}
        run: |
          if [[ "$NUBLAR_GATE_OUTCOME" != "success" ]]; then
            echo "Nublar decision exit code: ${NUBLAR_GATE_EXIT_CODE:-unknown}" >&2
            exit "${NUBLAR_GATE_EXIT_CODE:-2}"
          fi
