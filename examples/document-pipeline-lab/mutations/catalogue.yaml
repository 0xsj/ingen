mutation_catalogue:
  schema: ingen.mutation-catalogue/v1
  id: document-pipeline-mutations
  version: 1
  contract_id: document-pipeline
  contract_version: 2

  mutations:
    - id: status-200-create
      plane: implementation
      operator: response.status.replace
      target: POST /documents
      description: Return 200 instead of the contracted 202 for valid document creation.
      change:
        from: 202
        to: 200
      expected_rule_ids:
        - document.create.valid.accepted
      status: candidate

    - id: remove-name-create
      plane: implementation
      operator: response.field.remove
      target: POST /documents
      description: Remove the required name field from a valid document creation response.
      change:
        field: name
      expected_rule_ids:
        - document.create.valid.accepted
      status: candidate

    - id: unsupported-type-500
      plane: implementation
      operator: response.error.status.replace
      target: POST /documents
      description: Return 500 instead of the contracted 400 for an unsupported document type.
      change:
        code: unsupported_document_type
        from: 400
        to: 500
      expected_rule_ids:
        - document.create.rejects-unsupported-type
      status: candidate

    - id: process-stays-queued
      plane: implementation
      operator: state.transition.replace
      target: POST /documents/{id}/process
      description: Leave a processed document queued instead of transitioning it to completed.
      change:
        from: completed
        to: queued
      expected_rule_ids:
        - document.process.valid-completes
      status: candidate

    - id: persistence-under-wrong-key
      plane: implementation
      operator: state.persistence.key.replace
      target: POST /documents
      description: Persist an accepted document under a key different from the returned document ID.
      change:
        from: id
        to: mutation-discarded
      expected_rule_ids:
        - document.status.exposes-queued-state
      status: candidate

    - id: accepts-png
      plane: implementation
      operator: input.validation.suffix.add
      target: POST /documents
      description: Accept an unsupported PNG document type instead of rejecting it.
      change:
        suffix: .png
      expected_rule_ids:
        - document.create.rejects-unsupported-type
      status: candidate
