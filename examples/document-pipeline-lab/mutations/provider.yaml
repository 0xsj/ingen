mutation_provider:
  schema: ingen.mutation-provider/v1
  id: document-pipeline-fixtures
  version: 1
  plan_schema: ingen.mutation-plan/v1

  # This is a temporary prebuilt-variant provider. It proves the campaign
  # handoff end to end without pretending to be a general source mutator.
  capabilities:
    - plane: implementation
      operator: response.status.replace
      target: POST /documents
    - plane: implementation
      operator: response.field.remove
      target: POST /documents
    - plane: implementation
      operator: response.error.status.replace
      target: POST /documents
    - plane: implementation
      operator: state.transition.replace
      target: POST /documents/{id}/process
    - plane: implementation
      operator: state.persistence.key.replace
      target: POST /documents
    - plane: implementation
      operator: input.validation.suffix.add
      target: POST /documents
  entries:
    - mutation_id: status-200-create
      command: .artifacts/document-pipeline-subject/document-pipeline-defect
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: status-200-create

    - mutation_id: remove-name-create
      command: .artifacts/document-pipeline-subject/document-pipeline-defect-remove-name
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: remove-name-create

    - mutation_id: unsupported-type-500
      command: .artifacts/document-pipeline-subject/document-pipeline-defect-unsupported-type
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: unsupported-type-500

    - mutation_id: process-stays-queued
      command: .artifacts/document-pipeline-subject/document-pipeline-defect-process-stays-queued
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: process-stays-queued

    - mutation_id: persistence-under-wrong-key
      command: .artifacts/document-pipeline-subject/document-pipeline-defect-persistence-wrong-key
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: persistence-under-wrong-key

    - mutation_id: accepts-png
      command: .artifacts/document-pipeline-subject/document-pipeline-defect-accepts-png
      args:
        - -addr
        - "${SORA_ADDR}"
      subject_root: .
      variant: accepts-png
