schema: paddock.adapter-tests/v1

adapter:
  profile: rust-use-adapter.yaml

cases:
  - name: rust-hexagonal-good
    root: services/rust-hexagonal/good
    language: rust
    source_unit: file
    roots: [src]
    required_edge_kinds: [import]
    expect: pass
    package_count: 9
    edge_count: 13

  - name: rust-hexagonal-violating-graph
    root: services/rust-hexagonal/violating
    language: rust
    source_unit: file
    roots: [src]
    required_edge_kinds: [import]
    expect: pass
    package_count: 9
    edge_count: 14

  - name: unsupported-language
    root: services/rust-hexagonal/good
    language: go
    source_unit: file
    expect: error
    error_contains: supports language rust
