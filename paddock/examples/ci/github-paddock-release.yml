name: Paddock release

on:
  push:
    tags:
      - "paddock-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#paddock-v}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: |
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make -C paddock release-artifacts \
            VERSION="$RELEASE_VERSION" \
            COMMIT="$commit" \
            BUILD_DATE="$build_date" \
            RELEASE_DIR=".artifacts/paddock-release/$RELEASE_VERSION"

      - name: Verify release manifest
        run: |
          make -C paddock release-verify \
            VERSION="$RELEASE_VERSION" \
            RELEASE_MANIFEST="../.artifacts/paddock-release/$RELEASE_VERSION/release-manifest.json"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: paddock-${{ github.ref_name }}
          path: .artifacts/paddock-release
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Paddock $RELEASE_VERSION" \
            --generate-notes \
            .artifacts/paddock-release/"$RELEASE_VERSION"/*.tar.gz \
            .artifacts/paddock-release/"$RELEASE_VERSION"/SHA256SUMS \
            .artifacts/paddock-release/"$RELEASE_VERSION"/release-manifest.json
