schema: paddock.architecture/v1
project: hexagonal-application

source:
  language: go
  unit: package
  roots: [cmd, internal]

components:
  domain:
    match: internal/{context}/domain/**
    labels:
      role: domain
      context: "{context}"

  application:
    match: internal/{context}/application/**
    labels:
      role: application
      context: "{context}"

  port:
    match: internal/{context}/ports/**
    labels:
      role: port
      context: "{context}"

  inbound-adapter:
    match: internal/{context}/adapters/inbound/**
    labels:
      role: inbound-adapter
      context: "{context}"

  outbound-adapter:
    match: internal/{context}/adapters/outbound/**
    labels:
      role: outbound-adapter
      context: "{context}"

  composition:
    match: cmd/**
    labels:
      role: composition

rules:
  - id: domain-is-pure
    kind: allow-dependencies
    from: {role: domain}
    allow:
      - standard-library:errors
      - standard-library:fmt
      - {role: domain, context: same}
      - {role: port, context: same}
    message: the domain depends on stable abstractions, not infrastructure

  - id: application-points-inward
    kind: deny-dependencies
    from: {role: application}
    deny:
      - {role: inbound-adapter}
      - {role: outbound-adapter}
    message: application code must not reach into adapters

  - id: adapters-point-inward
    kind: allow-dependencies
    from: [{role: inbound-adapter}, {role: outbound-adapter}]
    allow:
      - {role: application, context: same}
      - {role: domain, context: same}
      - {role: port, context: same}
      - external: approved
    message: adapters translate at the boundary and point inward

  - id: contexts-are-islands
    kind: no-cross-context
    from: [{role: domain}, {role: application}, {role: port}]
    to: [{role: domain}, {role: application}, {role: port}]
    message: one bounded context must not import another bounded context

  - id: only-composition-wires-concrete-adapters
    kind: deny-dependencies
    from: [{role: domain}, {role: application}, {role: port}]
    deny:
      - {role: outbound-adapter}
      - {role: inbound-adapter}
    message: concrete adapter selection belongs in the composition root
